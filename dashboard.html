<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard APPE</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #1c1f6b;
    --red: #c0292a;
    --paper: #f7f3ec;
    --text: #1a1a2e;
    --muted: #5c6379;
    --line: rgba(28,31,107,0.14);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background: linear-gradient(140deg, #0f1147 0%, #20124d 50%, #3b1212 100%);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    padding: 2rem 1rem;
  }
  .container {
    width: min(980px, 100%);
    margin: 0 auto;
    background: var(--paper);
    border-radius: 24px;
    border: 1px solid rgba(255,255,255,0.2);
    padding: 2rem;
    box-shadow: 0 28px 60px rgba(0,0,0,0.2);
  }
  h1 {
    font-family: 'Playfair Display', serif;
    color: var(--navy);
    font-size: clamp(1.7rem, 4vw, 2.4rem);
    margin-bottom: 0.5rem;
  }
  .subtitle { color: var(--muted); margin-bottom: 1.4rem; }
  .actions { display: flex; gap: 0.75rem; flex-wrap: wrap; margin-bottom: 1.5rem; }
  .btn {
    border-radius: 12px;
    border: 1px solid var(--line);
    padding: 0.7rem 1rem;
    font-weight: 700;
    text-decoration: none;
    color: var(--navy);
    background: #fff;
    cursor: pointer;
  }
  .btn.primary { background: linear-gradient(135deg, var(--navy), var(--red)); color: #fff; border: none; }
  .panel {
    background: rgba(255,255,255,0.8);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 1rem;
    margin-bottom: 1rem;
  }
  .panel h2 { font-size: 1rem; color: var(--navy); margin-bottom: 0.6rem; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 0.8rem; }
  .item { padding: 0.7rem; border-radius: 12px; border: 1px solid rgba(28,31,107,0.12); background: #fff; }
  .label { font-size: 0.76rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
  .value { font-weight: 700; margin-top: 0.2rem; }
  .enrollment-list { display: grid; gap: 0.6rem; }
  .course { padding: 0.8rem; border-radius: 12px; border: 1px solid rgba(28,31,107,0.12); background: #fff; }
  .course strong { color: var(--navy); display: block; margin-bottom: 0.2rem; }
  .empty { color: var(--muted); }
  .status { margin-top: 0.8rem; color: var(--muted); }
</style>
</head>
<body>
  <main class="container">
    <h1>Dashboard do servidor</h1>
    <p class="subtitle">Resumo do seu acesso autenticado, sessão ativa e inscrições em cursos.</p>

    <div class="actions">
      <a class="btn primary" href="index.html">Ver cursos e inscrever</a>
      <a class="btn" href="login.html">Atualizar cadastro/login</a>
      <button class="btn" type="button" id="logout-btn">Encerrar sessão</button>
    </div>

    <section class="panel">
      <h2>Perfil autenticado</h2>
      <div class="grid" id="profile-grid"></div>
    </section>

    <section class="panel">
      <h2>Minhas inscrições</h2>
      <div class="enrollment-list" id="enrollments"></div>
      <p class="status" id="status"></p>
    </section>
  </main>

<script src="appe.config.js"></script>
<script>
  const PORTAL_CONFIG = window.APPE_CONFIG || {};
  const AUTH_STORAGE_KEY = 'appePortalSession';
  const FUNCTIONS_BASE_URL = PORTAL_CONFIG.functionsBaseUrl || 'https://karpafjlfehxwpefpvio.supabase.co/functions/v1';
  const SUPABASE_ANON_KEY = PORTAL_CONFIG.supabaseAnonKey || '';

  function getStoredSession() {
    try {
      return JSON.parse(localStorage.getItem(AUTH_STORAGE_KEY)) || null;
    } catch (error) {
      return null;
    }
  }

  function setStoredSession(session) {
    localStorage.setItem(AUTH_STORAGE_KEY, JSON.stringify(session));
  }

  function clearStoredSession() {
    localStorage.removeItem(AUTH_STORAGE_KEY);
  }

  async function callPortalAuth(body, token) {
    const response = await fetch(`${FUNCTIONS_BASE_URL}/portal-auth`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        ...(SUPABASE_ANON_KEY ? { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}` } : {}),
        ...(token ? { 'x-portal-session': token } : {})
      },
      body: JSON.stringify(body)
    });
    const payload = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(payload.error || 'Falha ao consultar sessao.');
    return payload;
  }

  function renderProfile(profile) {
    const entries = [
      ['Nome', profile.nome_completo],
      ['E-mail', profile.email],
      ['Matrícula', profile.matricula],
      ['Número', profile.numero],
      ['Método de login', profile.metodo_login === 'gmail' ? 'Google OAuth' : 'Dados institucionais']
    ];

    document.getElementById('profile-grid').innerHTML = entries.map(([label, value]) => `
      <div class="item">
        <div class="label">${label}</div>
        <div class="value">${value || '-'}</div>
      </div>
    `).join('');
  }

  function renderEnrollments(enrollments) {
    const container = document.getElementById('enrollments');
    if (!enrollments.length) {
      container.innerHTML = '<p class="empty">Nenhuma inscrição registrada ainda.</p>';
      return;
    }

    container.innerHTML = enrollments.map((item) => `
      <article class="course">
        <strong>${item.course_title}</strong>
        <div>Modalidade: ${item.course_mode}</div>
        <div>Data: ${item.course_date}</div>
      </article>
    `).join('');
  }

  async function bootDashboard() {
    const session = getStoredSession();
    if (!session?.token) {
      window.location.href = 'login.html';
      return;
    }

    try {
      const payload = await callPortalAuth({ action: 'session' }, session.token);
      renderProfile(payload.profile);
      renderEnrollments(payload.enrollments || []);
      setStoredSession({ token: session.token, expiresAt: payload.expiresAt, profile: payload.profile });
      document.getElementById('status').textContent = `Sessão válida até ${new Date(payload.expiresAt).toLocaleString('pt-BR')}.`;
    } catch (error) {
      clearStoredSession();
      window.location.href = 'login.html';
    }
  }

  document.getElementById('logout-btn').addEventListener('click', async () => {
    const session = getStoredSession();
    try {
      if (session?.token) {
        await callPortalAuth({ action: 'logout' }, session.token);
      }
    } catch (error) {
      // noop
    }
    clearStoredSession();
    window.location.href = 'login.html';
  });

  bootDashboard();
</script>
</body>
</html>
